# Template only. Prefer the `kubectl create secret` commands in README.md.
# If you use this file, copy it to secrets.yaml (git-ignored), fill in the
# placeholders, and `kubectl apply -f k8s/secrets.yaml`. Never commit real values.
---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-master-key
  namespace: litellm
type: Opaque
stringData:
  # Generate with: echo "sk-$(openssl rand -hex 32)"
  LITELLM_MASTER_KEY: <your-litellm-master-key>
---
apiVersion: v1
kind: Secret
metadata:
  name: gcp-creds
  namespace: litellm
type: Opaque
stringData:
  # Paste the full JSON of your Google credentials file
  # (application default credentials or a service account key).
  adc.json: |
    <paste-your-google-credentials-json-here>
